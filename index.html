function genOffers(free){
 const perf=G.lastRating||6.6,eff=G.ovr+clamp((perf-6.8)*3,-3,4)+G.fame*.03+(G.age<20?2:0);

  if(G.age>=31&&!L.vet)e-=(G.age-30)*.9;if(L.vet&&G.age>=29&&G.ovr>=76)e+=3;
  const gap=c.s-(e+1),sd=gap>0?2.2:5.5;return{c,gap,w:Math.exp(-(gap*gap)/(2*sd*sd))}});
 let pool=cand.filter(x=>x.w>.02),out=[];
 const nWant=RI(4,6);
 while(out.length<nWant&&pool.length){const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,j=0;for(;j<pool.length;j++){r-=pool[j].w;if(r<=0)break}j=Math.min(j,pool.length-1);out.push(pool[j].c);pool.splice(j,1)}
 if(out.length<3){cand.sort((a,b)=>Math.abs(a.gap)-Math.abs(b.gap));cand.forEach(x=>{if(out.length<3&&!out.includes(x.c))out.push(x.c)})}
 return out.sort((a,b)=>b.s-a.s).map(c=>{const L=LG[c.lk];const role=roleOf(G.ovr+bump-c.s);
  const sal=salaryFor(c)*(free?1.12:1);return{club:c,fee:free?0:val*R(.8,1.3)*(L.w>1.4?1.1:1),sal,yrs:yrsOpt(),role,bonus:sal*R(.3,.9),free}})}

 <div class="row"><div><label for="nu">Número</label><input id="nu" type="number" min="1" max="99" value="${RI(2,30)}"></div>
 <div><label for="ft">Pie hábil</label><select id="ft"><option>derecho</option><option>izquierdo</option><option>ambos</option></select></div></div>
 <label for="ct">País</label><select id="ct">${cs.map(c=>`<option value="${esc(c.n)}">${c.f} ${esc(c.n)}</option>`).join('')}</select>
 <label for="ps">Posición</label><select id="ps">${Object.entries(POS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>
 <button class="btn gold" onclick="startGame()">Debutar</button><button class="btn alt" onclick="menu()">Volver</button></div>`)}
function startGame(){
 const name=($('#nm').value||'').trim()||'Sin Nombre',num=clamp(parseInt($('#nu').value)||10,1,99);
 const nat=CO.find(c=>c.n===$('#ct').value),pos=$('#ps').value,foot=$('#ft').value;
 const pot=68+31*Math.pow(Math.random(),2.1),ovr=clamp(44+(pot-68)*.25+R(0,9),42,66);
 const peak=RI(24,30);
 G={name,num,nat,pos,foot,age:17,year:2026,ovr,pot,peak,vol:R(.6,1.8),injP:R(.7,1.4),fitness:70,moral:65,fame:5,coach:60,money:0,
  role:'Suplente',sal:0,yrs:MODE,lastRating:0,tot:{pj:0,g:0,a:0,earn:0},clubs:[],hon:[],awd:[],natHon:[],nt:{caps:0,g:0},natRet:false,nationalized:false,
  ban:0,outFrac:0,injBoost:0,pushT:false,scandals:0,hist:[{a:17,o:ovr}],peakOvr:ovr,peakVal:0,transfers:[],prevVal:0};
 let cand=CL.filter(c=>nat.home.includes(c.lk));cand.sort((a,b)=>Math.abs(a.s-ovr)-Math.abs(b.s-ovr));
 const c=pick(cand.slice(0,3));G.club=c;G.role=roleOf(ovr+3-c.s);G.sal=Math.max(.02,salaryFor(c)*.6);
 G.clubs.push({c,from:G.year+'/'+String(G.year+1).slice(2),to:'',pj:0,g:0,a:0,ns:0,tit:0});
 G.peakVal=mval();G.prevVal=G.peakVal;
 for(const k in BALLON)delete BALLON[k];
 EVQ=pickEvents();
 show(`<div class="hero"><h2>${esc(name)} debuta</h2><p>${nat.f} Nace una promesa en ${esc(c.n)} (${LG[c.lk].n}). Tu futuro depende de lo que decidas.</p></div>${card()}<button class="btn gold" onclick="nextEvent()">Empezar la carrera</button>`)}
function nextEvent(){
 if(!EVQ.length){runBlock();return}
 EV=EVQ.shift();
 show(`${card()}<div class="box"><h3>${EV.t}</h3><p>${EV.x}</p></div>${EV.o.map((o,i)=>`<button class="btn opt alt" onclick="choose(${i})">${o.l}${o.d?`<small>${o.d}</small>`:''}</button>`).join('')}`)}
function choose(i){const r=EV.o[i].f();
 G.ovr=clamp(G.ovr,35,99);['moral','fitness','fame','coach'].forEach(k=>G[k]=clamp(G[k],0,100));if(G.injBoost<0)G.injBoost=0;
 show(`${card()}<div class="box"><h3>${esc(EV.o[i].l)}</h3><p>${r}</p></div><button class="btn" onclick="nextEvent()">${EVQ.length?'Siguiente decisión':'Jugar '+(MODE==1?'la temporada':'las '+MODE+' temporadas')}</button>`)}
function runBlock(){LAST=[];G.prevVal=mval();
 for(let i=0;i<MODE;i++){if(G.age>=41)break;LAST.push(simSeason())}
 resultScr()}
function resultScr(){
 const sn=S=>`<div class="box season"><h3>${S.label} · ${esc(S.club.n)}</h3><p class="mute">${S.age} años · ${S.role} · media ${Math.round(S.ovr0)} → <b>${Math.round(S.ovr1)}</b> ${S.ovr1-S.ovr0>=.5?'▲':S.ovr1-S.ovr0<=-.5?'▼':'='}</p>
  <div class="st"><div><b>${S.pj}</b><small>partidos</small></div><div><b>${S.g}</b><small>goles</small></div><div><b>${S.a}</b><small>asist.</small></div><div><b>${S.rating?S.rating.toFixed(1):'-'}</b><small>nota</small></div></div>
  ${S.caps?`<p class="mute">${G.nat.f} Selección: ${S.caps} partidos, ${S.ng} goles</p>`:''}
  ${S.titles.map(t=>`<span class="tag g">🏆 ${esc(t.n)}</span>`).join('')}${S.awards.map(a=>`<span class="tag b">⭐ ${esc(a)}</span>`).join('')}${S.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`;
 show(`${LAST.map(sn).join('')}${card()}<div class="box"><h3>Evolución de tu media</h3>${spark()}</div><button class="btn gold" onclick="enterMarket()">Ir al mercado</button>`)}
function enterMarket(){
 if(G.age>=41){retire('Llegaste al límite de edad y colgás los botines.');return}
 const exp=G.yrs<=0;MKT={offers:genOffers(exp),renew:renewOffer(),used:{},exp};MSG=null;CONF=null;marketScr()}
function offerHTML(o,i){const L=LG[o.club.lk];
 return `<div class="offer ${o.renew?'renew':''}"><div class="top"><div><div class="nm">${esc(o.club.n)}</div><small>${L.f} ${o.club.div==1?L.d1:L.d2} · nivel ${Math.round(o.club.s)}</small></div><span class="tag ${o.role=='Estrella'?'g':''}">${o.role}</span></div>
 <div class="g2"><div>${o.renew?'Renovación':o.free?'Agente libre':'Traspaso'}<b>${o.renew||o.free?'Sin costo':fmtM(o.fee)}</b></div><div>Sueldo anual<b>${fmtM(o.sal)}</b></div><div>Contrato<b>${o.yrs} ${o.yrs==1?'año':'años'}</b></div><div>Prima de firma<b>${fmtM(o.bonus)}</b></div></div>
 <button class="btn ${o.renew?'':'alt'}" ${MKT.used[o.renew?'r':i]?'disabled':''} onclick="${o.renew?'acceptRenew()':'acceptOffer('+i+')'}">${MKT.used[o.renew?'r':i]?'Rechazada':o.renew?'Renovar contrato':o.free?'Firmar':'Aceptar oferta'}</button></div>`}
function marketScr(){
 const v=mval(),tr=v>G.prevVal*1.03?'▲ subió':v<G.prevVal*.97?'▼ bajó':'= estable';
 const sorted=MKT.offers;
 const natBtn=G.nt.caps>0&&!G.natRet?`<button class="btn alt" onclick="askConf('nat')">Retirarme de la selección<small>${G.nat.f} ${G.nt.caps} partidos, ${G.nt.g} goles</small></button>`:'';
 const conf=CONF?`<div class="box"><h3>${CONF=='retire'?'¿Te retirás del fútbol?':'¿Dejás la selección?'}</h3><p>${CONF=='retire'?'Tu carrera termina y se muestra el resumen final.':'No vas a volver a ser convocado, pero tendrás más descanso.'}</p><div class="row"><button class="btn warn" onclick="${CONF=='retire'?"retire('Decidiste colgar los botines.')":'doNatRet()'}">Sí</button><button class="btn alt" onclick="askConf(null)">No</button></div></div>`:'';
 show(`${MSG?`<div class="msg ${MSG.bad?'bad':''}">${MSG.t}</div>`:''}${card()}
 <div class="box"><h3>Mercado de pases</h3><p class="mute">Tu valor ${tr} (antes ${fmtM(G.prevVal)}). ${MKT.exp?'<b>Tu contrato venció:</b> firmá con un club o retirate.':''}</p>
 ${MKT.renew?offerHTML(MKT.renew):'<p class="mute">Tu club no te ofrece renovación.</p>'}</div>
 <h3 style="margin:14px 0 8px">Ofertas recibidas</h3>${sorted.map(offerHTML).join('')}
 <div class="box"><h3>Decisiones</h3>${MKT.exp?'':`<button class="btn alt" onclick="rescind()">Pedir la rescisión del contrato<small>El club decide si te deja ir (puede costarte una indemnización)</small></button>`}${natBtn}
 <button class="btn alt" onclick="askConf('retire')">Retirarme del fútbol</button>${conf}</div>
 <button class="btn gold" ${G.yrs<=0?'disabled':''} onclick="continueCareer()">Seguir la carrera${G.yrs<=0?'<small>Firmá un contrato primero</small>':''}</button>`)}
function askConf(x){CONF=x;marketScr()}
function say(t,bad){MSG={t,bad};marketScr()}
function finishSign(o,fromT){
 if(o.club.id!==G.club.id){const old=G.club;G.transfers.push({y:G.year,from:old.n,to:o.club.n,fee:o.fee});
  G.club=o.club;const e=G.clubs[G.clubs.length-1];if(!e.to)e.to=(G.year-1)+'/'+String(G.year).slice(2);
  G.clubs.push({c:o.club,from:G.year+'/'+String(G.year+1).slice(2),to:'',pj:0,g:0,a:0,ns:0,tit:0});G.coach=60;}
 G.sal=o.sal;G.yrs=o.yrs;G.role=o.role;G.money+=o.bonus;G.pushT=false;G.moral=clamp(G.moral+6,0,100)}
function acceptRenew(){const o=MKT.renew;MKT.used.r=1;G.sal=o.sal;G.yrs=o.yrs;G.money+=o.bonus;G.moral=clamp(G.moral+4,0,100);G.pushT=false;MKT.exp=false;
 say('Renovaste con '+esc(o.club.n)+' por '+o.yrs+' '+(o.yrs==1?'año':'años')+' con un sueldo de '+fmtM(o.sal)+' anuales.')}
function acceptOffer(i){const o=MKT.offers[i];
 if(o.free||G.yrs<=0){finishSign(o);MKT.exp=false;MKT.offers.forEach((_,k)=>MKT.used[k]=1);say('Firmaste con '+esc(o.club.n)+' como agente libre. Prima de firma: '+fmtM(o.bonus)+'.');return}
 const val=mval();let p=.35+(o.fee/val-1)*.9+(G.role=='Rotación'||G.role=='Suplente'?.25:0)+(G.role=='Estrella'?-.25:0)-(G.yrs>=3?.1:0)+(G.coach<40?.1:0)+(G.pushT?.3:0);
 p=clamp(p,.1,.95);
 if(Math.random()<p){finishSign(o);MKT.offers.forEach((_,k)=>MKT.used[k]=1);MKT.used.r=1;MKT.renew=null;say('✅ Traspaso cerrado: '+esc(G.transfers[G.transfers.length-1].from)+' recibe '+fmtM(o.fee)+' por vos. Nuevo club: '+esc(o.club.n)+'.')}
 else{MKT.used[i]=1;G.moral=clamp(G.moral-8,0,100);say('❌ '+esc(G.club.n)+' rechazó la oferta de '+esc(o.club.n)+'. Tu moral cayó.',true)}}
function rescind(){
 let p=.25+(G.role=='Suplente'?.5:G.role=='Rotación'?.3:0)+(G.role=='Estrella'?-.15:0)+(G.coach<35?.2:0)-(G.yrs>3?.1:0)+(G.pushT?.2:0);p=clamp(p,.05,.9);
 if(Math.random()<p){const cost=G.sal*.5*Math.min(G.yrs,3)*(G.role=='Suplente'?.4:1);G.money-=cost;G.yrs=0;G.fame=clamp(G.fame-3,0,100);G.prevVal=G.prevVal;
  MKT={offers:genOffers(true),renew:null,used:{},exp:true};say('📄 Rescisión aprobada. Pagaste '+fmtM(cost)+' de indemnización y quedaste libre: estas son tus nuevas ofertas.')}
 else{G.moral=clamp(G.moral-6,0,100);G.coach=clamp(G.coach-10,0,100);say('❌ El club rechazó tu pedido de rescisión y la relación se resintió.',true)}}
function doNatRet(){G.natRet=true;G.fitness=clamp(G.fitness+6,0,100);CONF=null;say('Renunciaste a la selección de '+esc(G.nat.n)+'. Tendrás más descanso.')}
function continueCareer(){CONF=null;G.prevVal=mval();EVQ=pickEvents();nextEvent()}

/* ===================== FINAL ===================== */
function verdict(){const p=G.peakOvr;return p>=95?'Leyenda eterna':p>=90?'Crack mundial':p>=85?'Estrella internacional':p>=78?'Profesional de élite':p>=70?'Jugador sólido':'Jornalero del fútbol'}
function retire(why){
 const titles=G.hon.filter(h=>h.t&&h.t!='extra'),nt=G.natHon.length;
 try{const a=JSON.parse(localStorage.getItem('leyenda_hof')||'[]');a.push({n:G.name,f:G.nat.f,peak:Math.round(G.peakOvr),tit:titles.length+nt});a.sort((x,y)=>y.peak-x.peak||y.tit-x.tit);localStorage.setItem('leyenda_hof',JSON.stringify(a.slice(0,5)))}catch(e){}
 const feeTotal=G.transfers.reduce((s,t)=>s+t.fee,0);
 const prof=G.peak<=25?'Precoz':G.peak>=29?'Tardío':'Normal';
 const txt=`⚽ ${G.name} ${G.nat.f} (${POS[G.pos].n})\nMedia máxima: ${Math.round(G.peakOvr)} · ${verdict()}\n${G.tot.pj} partidos, ${G.tot.g} goles, ${G.tot.a} asistencias\n🏆 ${titles.length} títulos de club · ${nt} con la selección · ${G.awd.length} premios\nClubes: ${G.clubs.map(c=>c.c.n).join(', ')}\nPatrimonio: ${fmtM(G.money)}`;
 const g=(a,k)=>{const m={};a.forEach(x=>m[x[k]]=(m[x[k]]||0)+1);return Object.entries(m)};
 const tl=g(titles,'n');
 show(`<div class="hero"><h2>${esc(G.name)} se retira</h2><p>${esc(why)} ${G.age} años de edad.</p></div>
 <div class="box" style="text-align:center"><div class="big">${Math.round(G.peakOvr)}</div><p><b>${verdict()}</b></p><small>Media máxima · Valor máximo ${fmtM(G.peakVal)}</small></div>
 <div class="box"><h3>Evolución de la media</h3>${spark()}<p class="mute">Perfil de crecimiento de esta partida: <b>${prof}</b> (pico a los ${G.peak}), potencial oculto <b>${Math.round(G.pot)}</b>.</p></div>
 <div class="box"><h3>Números de la carrera</h3><table><tr><td>Partidos</td><td class="n">${G.tot.pj}</td></tr><tr><td>Goles</td><td class="n">${G.tot.g}</td></tr><tr><td>Asistencias</td><td class="n">${G.tot.a}</td></tr>
 <tr><td>Selección (${G.nat.n})</td><td class="n">${G.nt.caps} p. · ${G.nt.g} g.</td></tr><tr><td>Ganancias totales</td><td class="n">${fmtM(G.tot.earn)}</td></tr><tr><td>Dinero movido en traspasos</td><td class="n">${fmtM(feeTotal)}</td></tr></table></div>
 <div class="box"><h3>Clubes</h3><div class="wrap"><table><tr><th>Club</th><th>Años</th><th class="n">PJ</th><th class="n">G</th><th class="n">A</th></tr>${G.clubs.filter(c=>c.ns>0).map(c=>`<tr><td>${esc(c.c.n)}<br><small>${LG[c.c.lk].f} ${c.c.div==1?LG[c.c.lk].d1:LG[c.c.lk].d2}</small></td><td>${c.from.slice(0,4)}–${c.to?c.to.slice(0,4)==c.from.slice(0,4)?String(+c.to.slice(0,4)+1):'20'+c.to.slice(5):''}</td><td class="n">${c.pj}</td><td class="n">${c.g}</td><td class="n">${c.a}</td></tr>`).join('')}</table></div></div>
 <div class="box"><h3>Títulos y premios</h3>${tl.length||nt||G.awd.length?tl.map(([n,k])=>`<span class="tag g">🏆 ${k}× ${esc(n)}</span>`).join('')+G.natHon.map(n=>`<span class="tag g">🌎 ${esc(n)}</span>`).join('')+g(G.awd.map(a=>({a:a.replace(/ \d{4}(\/\d\d)?$/,'')})),'a').map(([n,k])=>`<span class="tag b">⭐ ${k>1?k+'× ':''}${esc(n)}</span>`).join(''):'<p class="mute">Sin títulos ni premios esta vez.</p>'}${G.scandals?`<p class="mute">Sanciones por doping: ${G.scandals}</p>`:''}</div>
 <div class="box"><h3>Compartir</h3><textarea id="sh" readonly>${esc(txt)}</textarea><button class="btn" onclick="copyShare()">Copiar resumen</button></div>
 <button class="btn gold" onclick="menu()">Nueva carrera</button>`)}
function copyShare(){const t=$('#sh');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(_){}}}
function $(s){return document.querySelector(s)}
menu();
</script>
</body>
</html>
